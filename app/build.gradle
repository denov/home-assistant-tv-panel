plugins {
    id 'com.android.application'
}

android {
    namespace 'com.fullstacksystems.tvpanel'
    compileSdk 34

    defaultConfig {
        applicationId 'com.fullstacksystems.tvpanel'
        minSdk 26
        targetSdk 34
        versionCode 5
        versionName '0.5.0'
    }

    // The APKs on GitHub's releases are signed with the release key, which only the release workflow has
    // (TVPANEL_KEYSTORE and its password). Anything built without it is signed with the machine's debug key, for
    // installing over ADB. The two can't update each other: Android only installs over an app with the same key.
    def releaseKey = System.getenv('TVPANEL_KEYSTORE')
    signingConfigs {
        if (releaseKey) {
            release {
                storeFile file(releaseKey)
                storeType 'pkcs12'
                storePassword System.getenv('TVPANEL_KEYSTORE_PASSWORD')
                keyAlias System.getenv('TVPANEL_KEY_ALIAS') ?: 'tvpanel'
                keyPassword System.getenv('TVPANEL_KEYSTORE_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig releaseKey ? signingConfigs.release : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }
}

dependencies {
    // No libraries in the APK. Test only: plain JVM tests in src/test; org.json because android.jar's copy is a stub there.
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20231013'
}
