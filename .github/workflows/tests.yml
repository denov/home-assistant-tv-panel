name: Tests
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  pytest:
    runs-on: "ubuntu-latest"
    name: Pytest
    steps:
      - name: Check out the repository
        uses: "actions/checkout@v4"

      - name: Set up Python
        uses: "actions/setup-python@v5"
        with:
          python-version: "3.14"

      - name: Install test requirements
        run: pip install -r requirements_test.txt

      - name: Lint
        run: pip install ruff==0.14.0 && ruff check .

      - name: Run tests
        run: python -m pytest

  android:
    runs-on: "ubuntu-latest"
    name: Android app
    steps:
      - name: Check out the repository
        uses: "actions/checkout@v4"

      - name: Set up JDK 17
        uses: "actions/setup-java@v4"
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Unit tests and build
        run: ./gradlew --no-daemon testReleaseUnitTest assembleRelease
